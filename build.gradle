plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.lianglliu.Main'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // this-escape is a false positive for these plain entity classes: their constructors only
    // wire their own fields through final setters, and the hierarchy is closed.
    options.compilerArgs += ['-Xlint:all,-this-escape', '-Werror']
}

group = 'org.lianglliu'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


jar {
    manifest {
        attributes 'Main-Class': 'com.lianglliu.Main'
    }
}

test {
    useJUnitPlatform()
}